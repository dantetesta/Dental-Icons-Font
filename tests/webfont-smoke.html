<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>WEBFONT PENDING</title>
  <style>
    @font-face {
      font-family: "Dental Icons QA";
      src: url("../build/fonts/DentalIconsUpper-Regular.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
    }
    .sample { position: absolute; white-space: nowrap; font: 100px/1 "Dental Icons QA"; }
    #composed { font-feature-settings: "ccmp" 1, "liga" 1, "calt" 1, "kern" 1; }
    #fallback { font-feature-settings: "ccmp" 0, "liga" 0, "calt" 0, "kern" 0; }
  </style>
</head>
<body data-result="pending">
  <span id="composed" class="sample">M1</span>
  <span id="fallback" class="sample">M1</span>
  <script>
    document.fonts.ready.then(() => {
      const loaded = document.fonts.check('100px "Dental Icons QA"', 'M1');
      const composed = document.getElementById('composed').getBoundingClientRect().width;
      const fallback = document.getElementById('fallback').getBoundingClientRect().width;
      const passed = loaded && composed > 0 && fallback > composed;
      document.body.dataset.result = passed ? 'pass' : 'fail';
      document.body.dataset.composedWidth = composed.toFixed(2);
      document.body.dataset.fallbackWidth = fallback.toFixed(2);
      document.title = passed ? 'WEBFONT PASS' : 'WEBFONT FAIL';
    });
  </script>
</body>
</html>
